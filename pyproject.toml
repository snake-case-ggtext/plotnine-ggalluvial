[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plotnine-ggalluvial"
version = "0.1.0"
description = "Clean-room plotnine port of ggalluvial (geom_alluvium, geom_stratum, geom_flow, stat_alluvium, stat_stratum, stat_flow)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["plotnine>=0.14", "numpy", "pandas"]

[tool.setuptools.packages.find]
where = ["src"]
